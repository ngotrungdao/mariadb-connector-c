name: Build Binary Artifacts

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-packages:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            platform_id: mac
            artifact_name: mariadb-connector-c-macos-arm64
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DWITH_EXTERNAL_ZLIB=ON
            need_openssl: true

          - name: Windows x64
            os: windows-2025
            platform_id: windows
            artifact_name: mariadb-connector-c-windows-x64
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DWITH_CURL=ON

          - name: Linux x64
            os: ubuntu-24.04
            platform_id: linux
            artifact_name: mariadb-connector-c-linux-x64
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DWITH_EXTERNAL_ZLIB=ON

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS' && matrix.need_openssl == true
        shell: bash
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: |
          cmake --build build --config RelWithDebInfo --parallel

      - name: Package
        shell: bash
        run: |
          cpack --config build/CPackConfig.cmake -B build

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            build/*.zip
            build/*.tgz
            build/*.tar.gz

      - name: Extract runtime files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(build/*.zip build/*.tgz build/*.tar.gz)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No package archive found in build directory"
            exit 1
          fi

          rm -rf pkg-extract runtime-staging
          mkdir -p pkg-extract runtime-staging/libs
          (cd pkg-extract && cmake -E tar xvf "../${archives[0]}" >/dev/null)

          package_root="$(find pkg-extract -type f -path '*/include/mariadb/mysql.h' | head -n1 | sed 's#/include/mariadb/mysql.h##')"
          if [ -z "$package_root" ]; then
            echo "Could not find include/mariadb/mysql.h in extracted package"
            find pkg-extract -maxdepth 5 -type d
            exit 1
          fi

          cp "$package_root/include/mariadb/mysql.h" runtime-staging/mysql.h

          case "${{ matrix.platform_id }}" in
            linux)
              cp "$package_root/lib/mariadb"/*.so* runtime-staging/libs/
              ;;
            mac)
              cp "$package_root/lib/mariadb"/*.dylib runtime-staging/libs/
              ;;
            windows)
              if compgen -G "$package_root/lib/mariadb/*.dll" > /dev/null; then
                cp "$package_root/lib/mariadb"/*.dll runtime-staging/libs/
              fi
              if compgen -G "$package_root/bin/*.dll" > /dev/null; then
                cp "$package_root/bin"/*.dll runtime-staging/libs/
              fi
              ;;
          esac

          if [ -z "$(find runtime-staging/libs -maxdepth 1 -type f -print -quit)" ]; then
            echo "No runtime libraries were collected for platform ${{ matrix.platform_id }}"
            exit 1
          fi

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform_id }}
          if-no-files-found: error
          path: runtime-staging/**

  bundle-runtime:
    name: Bundle Runtime Headers And Libs
    needs: build-packages
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux runtime artifact
        uses: actions/download-artifact@v5
        with:
          name: runtime-linux
          path: runtime/linux

      - name: Download macOS runtime artifact
        uses: actions/download-artifact@v5
        with:
          name: runtime-mac
          path: runtime/mac

      - name: Download Windows runtime artifact
        uses: actions/download-artifact@v5
        with:
          name: runtime-windows
          path: runtime/windows

      - name: Assemble final runtime folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mariadb
          mkdir -p mariadb/linux mariadb/mac mariadb/windows

          cp runtime/linux/mysql.h mariadb/linux/
          cp runtime/linux/libs/* mariadb/linux/
          cp runtime/mac/libs/* mariadb/mac/
          cp runtime/windows/libs/* mariadb/windows/

      - name: Upload bundled runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-connector-c-runtime-bundle
          if-no-files-found: error
          path: mariadb/**
