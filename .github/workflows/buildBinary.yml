name: Build Binary Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-packages:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            platform_id: mac
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DWITH_EXTERNAL_ZLIB=ON
            need_openssl: true

          - name: Windows x64
            os: windows-2025
            platform_id: windows
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DWITH_CURL=ON

          - name: Linux x64
            os: ubuntu-24.04
            platform_id: linux
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DWITH_EXTERNAL_ZLIB=ON

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS' && matrix.need_openssl == true
        shell: bash
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: |
          cmake --build build --config RelWithDebInfo --parallel

      - name: Package
        shell: bash
        run: |
          cpack --config build/CPackConfig.cmake -B build

      - name: Extract runtime files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(build/*.zip build/*.tgz build/*.tar.gz)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No package archive found in build directory"
            exit 1
          fi

          rm -rf pkg-extract runtime-staging
          mkdir -p pkg-extract runtime-staging/include runtime-staging/lib
          (cd pkg-extract && cmake -E tar xvf "../${archives[0]}" >/dev/null)

          package_root="$(find pkg-extract -type f -path '*/include/mariadb/mysql.h' | head -n1 | sed 's#/include/mariadb/mysql.h##')"
          if [ -z "$package_root" ]; then
            echo "Could not find include/mariadb/mysql.h in extracted package"
            find pkg-extract -maxdepth 5 -type d
            exit 1
          fi

          cp -R "$package_root/include/mariadb/." runtime-staging/include/

          case "${{ matrix.platform_id }}" in
            linux)
              cp "$package_root/lib/mariadb"/*.so* runtime-staging/lib/
              ;;
            mac)
              cp "$package_root/lib/mariadb"/*.dylib runtime-staging/lib/
              ;;
            windows)
              if compgen -G "$package_root/lib/mariadb/*.dll" > /dev/null; then
                cp "$package_root/lib/mariadb"/*.dll runtime-staging/lib/
              fi
              if compgen -G "$package_root/bin/*.dll" > /dev/null; then
                cp "$package_root/bin"/*.dll runtime-staging/lib/
              fi
              ;;
          esac

          if [ -z "$(find runtime-staging/include -maxdepth 1 -type f -print -quit)" ]; then
            echo "No header files were collected for platform ${{ matrix.platform_id }}"
            exit 1
          fi

          if [ -z "$(find runtime-staging/lib -maxdepth 1 -type f -print -quit)" ]; then
            echo "No runtime libraries were collected for platform ${{ matrix.platform_id }}"
            exit 1
          fi

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform_id }}
          if-no-files-found: error
          path: runtime-staging/**

  bundle-runtime:
    name: Bundle Runtime Headers And Libs
    needs: build-packages
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux runtime artifact
        uses: actions/download-artifact@v5
        with:
          name: runtime-linux
          path: runtime/linux

      - name: Download macOS runtime artifact
        uses: actions/download-artifact@v5
        with:
          name: runtime-mac
          path: runtime/mac

      - name: Download Windows runtime artifact
        uses: actions/download-artifact@v5
        with:
          name: runtime-windows
          path: runtime/windows

      - name: Assemble final runtime folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mariadb
          mkdir -p mariadb/linux/include mariadb/linux/lib
          mkdir -p mariadb/mac/include mariadb/mac/lib
          mkdir -p mariadb/windows/include mariadb/windows/lib

          cp -R runtime/linux/include/. mariadb/linux/include/
          cp runtime/linux/lib/* mariadb/linux/lib/
          cp -R runtime/mac/include/. mariadb/mac/include/
          cp runtime/mac/lib/* mariadb/mac/lib/
          cp -R runtime/windows/include/. mariadb/windows/include/
          cp runtime/windows/lib/* mariadb/windows/lib/

      - name: Upload bundled runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-connector-c-runtime-bundle
          if-no-files-found: error
          path: mariadb/**

      - name: Delete intermediate runtime artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const toDelete = new Set([
              'runtime-linux',
              'runtime-mac',
              'runtime-windows',
              'mariadb-connector-c-macos-arm64',
              'mariadb-connector-c-windows-x64',
              'mariadb-connector-c-linux-x64'
            ]);

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });

            for (const artifact of data.artifacts) {
              if (!toDelete.has(artifact.name)) {
                continue;
              }

              core.info(`Deleting artifact ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
